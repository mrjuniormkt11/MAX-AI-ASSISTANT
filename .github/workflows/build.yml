
name: Build MAX Android APK

on:
  workflow_dispatch:
  push:
    paths:
   unzip -q "MAX_Project_for_GitHub (1).zip" -d extracted
      
  

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
            packages: ''

      - name: Extract MAX Project
        run: |
          unzip -q MAX_Project_for_GitHub.zip -d extracted

          PROJECT_DIR=$(find extracted -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Gradle project not found in ZIP"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build MAX APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload MAX APK
        uses: actions/upload-artifact@v4
        with:
          name: MAX-Android-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
